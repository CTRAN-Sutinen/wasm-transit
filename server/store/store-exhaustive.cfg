SPECIFICATION Spec

(* The exhaustive tier of `just spec`: SPEC_CFG=server/store/store-exhaustive.cfg
   just spec — two processes, three hashes, a longer log; still
   exhaustive, thanks to SYMMETRY. TLC_WORKERS/TLC_XMX size the run. *)

CONSTANTS
    Procs = {p1, p2}
    Hashes = {h1, h2, h3}
    MaxSeq = 4
    Restore = TRUE

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LogChained
    RefsDurable
    AtRest
    CacheBehind

PROPERTIES
    RecordsImmutable
    HeadMonotone
