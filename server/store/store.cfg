SPECIFICATION Spec

(* The pinned quick check of `just spec`: two processes sharing the
   bucket, one offline GC beside them, every crash point. *)

CONSTANTS
    Procs = {p1, p2}
    Hashes = {h1, h2}
    MaxSeq = 3
    Restore = TRUE

(* Hashes and processes are symmetric — see Symmetry in store.tla. *)
SYMMETRY Symmetry

(* The MaxSeq bound can strand a state with no enabled action; that is
   the bound, not the store (the real store always accepts a commit),
   so deadlock is not checked. *)
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    LogChained
    RefsDurable
    AtRest
    CacheBehind

PROPERTIES
    RecordsImmutable
    HeadMonotone
