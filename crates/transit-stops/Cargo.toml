[package]
name = "transit-stops"
description = "The stops document: every stop as a list of dated events (opened, closed, reopened, moved, changed, proposed, retired) — the stop on a date, whether it is served, the refusals a write must pass, and canonical bytes. Beside the plans, never copied by a fork; nothing in it means today. Pure and stateless."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-geo = { path = "../transit-geo", default-features = false }
transit-version = { path = "../transit-version", default-features = false }
# The join with a network: a pick reads the stops document.
transit-network = { path = "../transit-network", default-features = false }
# The pick's period: which picks bound it.
transit-plans = { path = "../transit-plans", default-features = false }
# The rule of a stop request's reference to its stop (request_rule).
transit-requests = { path = "../transit-requests", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }
sha2 = { workspace = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-geo/bindings", "transit-version/bindings", "transit-network/bindings", "transit-plans/bindings", "transit-requests/bindings", "transit-date/bindings"]

[dev-dependencies]
proptest = "1"
