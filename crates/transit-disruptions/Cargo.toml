[package]
name = "transit-disruptions"
description = "What is disrupted on a day, and whether an alert explains it (D-213, D-218): the edit document's diversions and cancels, the live feed's cancels, and the suspended stops, each as its document gives it, with the names a rider uses, the alerts that explain it, and its latest note; the gap list; and the day by route. Pure and stateless."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-alerts = { path = "../transit-alerts" }
transit-live = { path = "../transit-live" }
transit-network = { path = "../transit-network" }
transit-notes = { path = "../transit-notes" }
transit-stops = { path = "../transit-stops" }
transit-sync = { path = "../transit-sync" }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
transit-codec = { path = "../transit-codec" }
