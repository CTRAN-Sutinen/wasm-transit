[package]
name = "transit-disruptions"
description = "What is disrupted on a day, and whether an alert explains it (D-213): the edit document's diversions and cancels, the live feed's cancels, and the suspended stops, each as its document gives it, with the names a rider uses, the alerts that explain it, and its latest note; the gap list; and the day by route. Pure and stateless."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-alerts = { path = "../transit-alerts", default-features = false }
transit-live = { path = "../transit-live", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
transit-notes = { path = "../transit-notes", default-features = false }
transit-stops = { path = "../transit-stops", default-features = false }
transit-sync = { path = "../transit-sync", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-alerts/bindings", "transit-live/bindings", "transit-network/bindings", "transit-notes/bindings", "transit-stops/bindings", "transit-sync/bindings", "transit-date/bindings"]

[dev-dependencies]
transit-codec = { path = "../transit-codec" }
