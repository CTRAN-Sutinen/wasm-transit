[package]
name = "transit-streets"
description = "The streets model: the canonical streets document, its import from street layers (GeoJSON lines: agency exports, TIGER, OSM), and the routing graph over it (snapping, shortest paths). Pure and stateless."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-geo = { path = "../transit-geo", default-features = false }
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-geo/bindings", "transit-version/bindings"]

[dev-dependencies]
proptest = "1"
