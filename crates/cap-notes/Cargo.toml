[package]
name = "cap-notes"
description = "The notes capability (transit-notes): the agency's internal notes about a trip instance, an edit record, a service alert, or a stop. validate answers what a write must pass, each refusal named, or the canonical document and its hash; write answers the next document with one note written or edited, stamped with its writer and time; on answers a target's notes; between answers the notes of a time span. The kernel's load_notes registers a document the host holds. The module writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
transit-log = { path = "../transit-log", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-notes = { path = "../transit-notes", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-version/bindings", "transit-log/bindings", "transit-notes/bindings", "cap-abi/bindings", "fixtures?/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
