[package]
name = "cap-rt"
description = "The realtime capability: decode a GTFS-rt protobuf payload (trip updates, vehicle positions) into the overview view. The third capability extracted from the monolith — transit-rt is shared as a library. A pure decoder: it writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]  # rlib: integration tests link the crate natively

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true }
transit-rt = { path = "../transit-rt" }
transit-network = { path = "../transit-network" }
# The live document: minted here from the snapshot and the network;
# the import's Boundary carries the published stop_sequence
# numbering rt updates name.
transit-codec = { path = "../transit-codec" }
transit-live = { path = "../transit-live" }
cap-abi = { path = "../cap-abi" }

[dev-dependencies]
sha2 = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
