[package]
name = "cap-rt"
description = "The realtime capability: decode a GTFS-rt protobuf payload (trip updates, vehicle positions) into the overview view. The third capability extracted from the monolith — transit-rt is shared as a library. A pure decoder: it writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]  # rlib: integration tests link the crate natively

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
transit-rt = { path = "../transit-rt" }
cap-abi = { path = "../cap-abi" }

[dev-dependencies]
prost = { workspace = true }
serde_json = { workspace = true }
