[package]
name = "cap-rt"
description = "The realtime capability: decode a GTFS-rt protobuf payload (trip updates, vehicle positions) into the overview view. The third capability extracted from the monolith — transit-rt is shared as a library. A pure decoder: it writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-rt = { path = "../transit-rt", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
# The live document: minted here from the snapshot and the network;
# the import's Boundary carries the published stop_sequence
# numbering rt updates name.
transit-codec = { path = "../transit-codec", default-features = false }
transit-live = { path = "../transit-live", default-features = false }
transit-alerts = { path = "../transit-alerts", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-rt/bindings", "transit-network/bindings", "transit-codec/bindings", "transit-live/bindings", "transit-alerts/bindings", "cap-abi/bindings", "fixtures?/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]

[dev-dependencies]
sha2 = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
