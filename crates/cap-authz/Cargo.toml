[package]
name = "cap-authz"
description = "The authorization capability: may this identity perform this action on this pointer? A pure, fail-closed decision over the policy document (transit-authz is the library; the host verifies the JWT and owns the clock)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
transit-authz = { path = "../transit-authz" }
cap-abi = { path = "../cap-abi" }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true }

[features]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
