[package]
name = "transit-rt"
description = "GTFS-realtime types generated from the official proto, decode helpers, the joins over the network, and the service alerts document encoded as an Alerts feed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version" }
prost = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }
# The joins: rt delays against the network's trips, in model
# vocabulary.
transit-network = { path = "../transit-network" }
# The published stop_sequence numbering rt updates name (the import's
# Boundary).
transit-codec = { path = "../transit-codec" }
transit-live = { path = "../transit-live" }
# The service alerts document, which the Alerts feed serializes.
transit-alerts = { path = "../transit-alerts" }
# A descriptor's start_date read as the instance's service date.
chrono = { workspace = true }

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
