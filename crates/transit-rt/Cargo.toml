[package]
name = "transit-rt"
description = "GTFS-realtime types generated from the official proto, decode helpers, the joins over the network, and the service alerts document encoded as an Alerts feed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
prost = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
# The joins: rt delays against the network's trips, in model
# vocabulary.
transit-network = { path = "../transit-network", default-features = false }
# The published stop_sequence numbering rt updates name (the import's
# Boundary).
transit-codec = { path = "../transit-codec", default-features = false }
transit-live = { path = "../transit-live", default-features = false }
# The service alerts document, which the Alerts feed serializes.
transit-alerts = { path = "../transit-alerts", default-features = false }
# A descriptor's start_date read as the instance's service date.
transit-date = { path = "../transit-date", default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-version/bindings", "transit-network/bindings", "transit-codec/bindings", "transit-live/bindings", "transit-alerts/bindings", "transit-date/bindings"]

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
