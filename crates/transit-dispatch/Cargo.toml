[package]
name = "transit-dispatch"
description = "The operator's day, model-native: operator edits patched over the MATERIALIZED day, the board and the station board over the model's walking groups, and the authored block chain with its layover ripple. The shared library behind cap-dispatch — the monolith's departures/block_trips shape, rebuilt over the network document instead of a GTFS registry."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-geo = { path = "../transit-geo", default-features = false }
transit-version = { path = "../transit-version", default-features = false }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
transit-sync = { path = "../transit-sync", default-features = false }
# The live document (model vocabulary) the realtime-first board reads.
transit-live = { path = "../transit-live", default-features = false }
# The watchlist's migration chain steps over JSON values.
serde_json = { workspace = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-geo/bindings", "transit-version/bindings", "transit-network/bindings", "transit-sync/bindings", "transit-live/bindings", "transit-date/bindings"]

[dev-dependencies]
proptest = "1"
transit-codec = { path = "../transit-codec" }
