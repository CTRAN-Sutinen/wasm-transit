[package]
name = "cap-router"
description = "The router capability: trip planning (earliest arrival; arrive-by, the latest departure) over the NETWORK document and the effective day (the model's materialized trips, patched with the edits in force), at the live document's predicted times when one is named. The diversion delta is the compare facet: the unpatched day, one materialization apart, with the rider's notice."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
transit-date = { path = "../transit-date", default-features = false }
ts-rs = { workspace = true, optional = true }
transit-network = { path = "../transit-network", default-features = false }
transit-sync = { path = "../transit-sync", default-features = false }
transit-dispatch = { path = "../transit-dispatch", default-features = false }
transit-router = { path = "../transit-router", default-features = false }
transit-streets = { path = "../transit-streets", default-features = false }
transit-live = { path = "../transit-live", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-network/bindings", "transit-sync/bindings", "transit-dispatch/bindings", "transit-router/bindings", "transit-streets/bindings", "transit-live/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]

[dev-dependencies]
# The composition law: the document hash is sha256 of the canonical
# serialization — the same format every capability and the manifest
# use. Fixture documents come through the codec's import (the
# sanctioned dev-only path).
sha2 = { workspace = true }
transit-codec = { path = "../transit-codec" }
