[package]
name = "cap-router"
description = "The router capability: earliest-arrival planning over the NETWORK document and the effective day (the model's materialized trips, patched with the edits in force). The diversion delta is the compare facet: the unpatched day, one materialization apart."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]  # rlib: integration tests link the crate natively

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
transit-network = { path = "../transit-network" }
transit-sync = { path = "../transit-sync" }
transit-dispatch = { path = "../transit-dispatch" }
transit-router = { path = "../transit-router" }
cap-abi = { path = "../cap-abi" }

[dev-dependencies]
# The composition law: the document hash is sha256 of the canonical
# serialization — the same format every capability and the manifest
# use. Fixture documents come through the codec's import (the
# sanctioned dev-only path).
sha2 = { workspace = true }
transit-codec = { path = "../transit-codec" }
transit-core = { path = "../transit-core" }
