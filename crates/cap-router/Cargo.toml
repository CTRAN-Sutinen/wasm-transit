[package]
name = "cap-router"
description = "The router capability: earliest-arrival planning over a GTFS feed keyed by content hash. A pure-function capability — it consumes the feed document the gtfs capability produces, and answers nothing else."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]  # rlib: integration tests link the crate natively

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true }
chrono = { workspace = true }
transit-core = { path = "../transit-core" }
transit-router = { path = "../transit-router" }
cap-abi = { path = "../cap-abi" }

[dev-dependencies]
# The composition law: the document hash is sha256 of the content —
# the same format the gtfs capability and the manifest use. (Linking
# cap-gtfs here would collide the two modules' #[no_mangle] ABI
# exports, so the law is asserted against the hash directly.)
sha2 = { workspace = true }
