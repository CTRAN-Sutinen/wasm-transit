[package]
name = "transit-analysis"
description = "Planner analysis over an authored network document: network/route/stop stats, service-type overview, population coverage. Pure functions — the same numbers on every host, never computed in a host."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-geo = { path = "../transit-geo", default-features = false }
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
transit-date = { path = "../transit-date", default-features = false }
ts-rs = { workspace = true, optional = true }
transit-network = { path = "../transit-network", default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-geo/bindings", "transit-version/bindings", "transit-network/bindings", "transit-date/bindings"]

[dev-dependencies]
proptest = "1"
zip = { workspace = true }
# The property-law generator builds networks by importing a generated
# feed — the inference lives in transit-codec (the shared library),
# so the law suite dev-depends on it.
transit-codec = { path = "../transit-codec" }
