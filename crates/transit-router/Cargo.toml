[package]
name = "transit-router"
description = "Trip planning over the network model (RAPTOR: earliest arrival, and latest departure for arrive-by), optionally over the live document's predicted times — pure algorithm, no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-geo = { path = "../transit-geo", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
# The live document (read-only): predicted times per trip instance.
transit-live = { path = "../transit-live", default-features = false }
# The walk table (read-only): street walks between the network's stops.
transit-streets = { path = "../transit-streets", default-features = false }
# The board's one wait rule (D-24): "leave in N min".
transit-dispatch = { path = "../transit-dispatch", default-features = false }
transit-date = { path = "../transit-date", default-features = false }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-geo/bindings", "transit-network/bindings", "transit-live/bindings", "transit-streets/bindings", "transit-dispatch/bindings", "transit-date/bindings"]

[dev-dependencies]
# Tests compose over real documents: fixture feeds go through the
# codec's import (the sanctioned dev-only path) and the model's own
# materialize — never the GTFS substrate in production code.
transit-codec = { path = "../transit-codec" }
proptest = "1"
serde_json = { workspace = true }
zip = { workspace = true }
