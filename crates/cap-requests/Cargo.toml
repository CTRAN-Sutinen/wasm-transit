[package]
name = "cap-requests"
description = "The stop requests capability (transit-requests): the planning team's requests for work at a stop, each tracking the work order the agency's work order system opens for it. validate answers what a write must pass — each refusal named, or the canonical document and its hash; requests_for answers a stop's requests; put answers the next document with one request placed by id, checked; vocabulary answers the lists a request's answers come from. The kernel's load_stop_requests registers a document the host holds. The module writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-log = { path = "../transit-log", default-features = false }
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-requests = { path = "../transit-requests", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-log/bindings", "transit-version/bindings", "transit-requests/bindings", "cap-abi/bindings", "fixtures?/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
