[package]
name = "cap-plans"
description = "The plan-chain capability: which service plan governs a date — resolution, governing periods, and chain validity over the plan set's metadata (the chain is derived, never stored; unversioned plans never resolve). The domain code lives in the shared transit-plans library; pure ops, no registries."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]  # rlib: integration tests link the crate natively

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
chrono = { workspace = true }
transit-plans = { path = "../transit-plans" }
cap-abi = { path = "../cap-abi" }
