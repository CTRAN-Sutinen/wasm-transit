[package]
name = "cap-plans"
description = "The plan-chain capability: which service plan governs a date — resolution, governing periods, and chain validity over the plan set's metadata (the chain is derived, never stored; unversioned plans never resolve). The domain code lives in the shared transit-plans library; pure ops over the plan set; a pick it writes is checked as a network and reads the stops document."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }
transit-plans = { path = "../transit-plans", default-features = false }
transit-log = { path = "../transit-log", default-features = false }
# A pick's checks: the network's publish check and canonical
# bytes, and what the pick reads of the stops document.
transit-network = { path = "../transit-network", default-features = false }
transit-stops = { path = "../transit-stops", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-version/bindings", "transit-plans/bindings", "transit-log/bindings", "transit-network/bindings", "transit-stops/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
