[package]
name = "cap-runcut"
description = "The runcut capability: what does this vehicle do today — the day's blocks list (which vehicles are out) and one block's authored chain with the layover ripple. The materialized day over the NETWORK document, patched with the edits in force; model-native end to end, the domain code lives in the shared transit-dispatch library."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
transit-date = { path = "../transit-date", default-features = false }
ts-rs = { workspace = true, optional = true }
transit-network = { path = "../transit-network", default-features = false }
transit-sync = { path = "../transit-sync", default-features = false }
transit-dispatch = { path = "../transit-dispatch", default-features = false }
transit-runs = { path = "../transit-runs", default-features = false }
transit-live = { path = "../transit-live", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-network/bindings", "transit-sync/bindings", "transit-dispatch/bindings", "transit-runs/bindings", "transit-live/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]

[dev-dependencies]
sha2 = { workspace = true }
transit-codec = { path = "../transit-codec" }
