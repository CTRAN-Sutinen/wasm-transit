[package]
name = "transit-live"
description = "THE live document: GTFS-rt answers resolved into model vocabulary — delays per derived trip and stop, vehicles on derived trips, and the on-time window that classifies them. Pure data plus the classification rule; cap-rt mints it, the day views (cap-board) consume it by hash."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
# The alert vocabulary (cause, effect, severity, period) a live alert uses.
transit-alerts = { path = "../transit-alerts", default-features = false }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings", "transit-alerts/bindings"]

[dev-dependencies]
serde_json = { workspace = true }
