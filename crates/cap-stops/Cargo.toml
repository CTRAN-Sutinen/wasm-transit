[package]
name = "cap-stops"
description = "The stops capability: every stop's own life as a list of dated events (transit-stops). validate answers what a write must pass — each refusal named, or the canonical document and its hash; stops_on and stop answer stops as their events make them on a date; seed, add_event and correct_event answer the next document; read_records and visit_warnings are what a pick reads of it; export_versions and import_events are GTFS out and in with the stops' history; questions answers what a site survey asks, and attribute_surveys names the signed-in writer as each new survey's surveyor; receive writes the stops log whole, the stops and the stop requests together. The kernel's load_stops registers a document the host holds. transit-stops is shared as a library; the module writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-log = { path = "../transit-log", default-features = false }
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }
transit-stops = { path = "../transit-stops", default-features = false }
transit-requests = { path = "../transit-requests", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
transit-plans = { path = "../transit-plans", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-log/bindings", "transit-version/bindings", "transit-stops/bindings", "transit-requests/bindings", "transit-network/bindings", "transit-plans/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
