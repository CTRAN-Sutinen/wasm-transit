[package]
name = "transit-requests"
description = "The stop requests document: the planning team's submissions for work at a stop — a new stop, a reinstall, a relocation or removal, a repair, a temporary stop — each tracking the work order the agency's work order system opens for it. What a write must pass, and canonical bytes. Pure and stateless."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings", "transit-date/bindings"]

[dev-dependencies]
proptest = "1"
