[package]
name = "cap-sync"
description = "The sync capability: the converged state of an edit document — sync_edits (LWW merge per record id plus the submit transition, receive-clamped to the host clock, D-56, answering the canonical document and its hash), read_edits (migrate-at-receive), compact_edits (the D-57 tombstone commit); the disruptions log's records (D-190; cap-log keeps the log): log_records, log_document, log_revert (stamped to win the merge, D-193). transit-sync is the library; the host passes the clock. Validation against the network is every model-side module's load_edits answer, never this one's."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-sync = { path = "../transit-sync", default-features = false }
transit-log = { path = "../transit-log", default-features = false }
transit-version = { path = "../transit-version", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-sync/bindings", "transit-log/bindings", "transit-version/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]

[dev-dependencies]
transit-date = { path = "../transit-date", default-features = false }
