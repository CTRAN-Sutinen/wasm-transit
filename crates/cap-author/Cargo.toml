[package]
name = "cap-author"
description = "The authoring capability: what does this network become after these edits? Typed, atomic edits over the NETWORK document answer the next document (never mutating the last) under its content hash, with its validation issues and warnings — the planner's verb on the bus, the same for a UI, a script, and an agent."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-network = { path = "../transit-network", default-features = false }
transit-runs = { path = "../transit-runs", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-network/bindings", "transit-runs/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures", "bindings"]

[dev-dependencies]
sha2 = { workspace = true }
transit-date = { path = "../transit-date", default-features = false }
