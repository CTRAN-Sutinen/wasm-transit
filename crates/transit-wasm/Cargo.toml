[package]
name = "transit-wasm"
description = "The wasm artifact: a flat, import-free C ABI over transit-ops' dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true

# cdylib only: the output of `cargo build --release --target
# wasm32-unknown-unknown` is THE deployment artifact — the same bytes
# the browser fetches and the Go sync server loads into wazero. No
# wasm-bindgen, no glue, no post-processing step that could differ
# between hosts.
[lib]
crate-type = ["cdylib"]

[dependencies]
transit-ops = { path = "../transit-ops" }
