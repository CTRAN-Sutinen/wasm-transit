[package]
name = "transit-authz"
description = "The authorization policy document and the pure authorize decision: may this identity perform this action on this pointer? Fail-closed."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings"]

[dev-dependencies]
proptest = "1"
