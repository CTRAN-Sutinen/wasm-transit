[package]
name = "cap-migrate"
description = "The migration capability: bring an older document forward to the version this build reads. Every authored kind's chain, kept forever; pure, deterministic, every loss reported. Consumers read the current version only and never carry old chains."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-network = { path = "../transit-network", default-features = false }
transit-sync = { path = "../transit-sync", default-features = false }
transit-rider = { path = "../transit-rider", default-features = false }
transit-alerts = { path = "../transit-alerts", default-features = false }
transit-requests = { path = "../transit-requests", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-network/bindings", "transit-sync/bindings", "transit-rider/bindings", "transit-alerts/bindings", "transit-requests/bindings", "cap-abi/bindings", "fixtures?/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
