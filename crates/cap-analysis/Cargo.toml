[package]
name = "cap-analysis"
description = "The analysis capability: planner numbers (stats, service types, coverage) over a network document keyed by content hash. The first REAL capability extracted from the monolith — transit-analysis is shared as a library, and the monolith keeps shrinking."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
transit-date = { path = "../transit-date", default-features = false }
ts-rs = { workspace = true, optional = true }
transit-network = { path = "../transit-network", default-features = false }
transit-analysis = { path = "../transit-analysis", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-network/bindings", "transit-analysis/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]

[dev-dependencies]
sha2 = { workspace = true }
proptest = "1"
zip = { workspace = true }
transit-network = { path = "../transit-network" }
transit-codec = { path = "../transit-codec" }
