[package]
name = "transit-codec"
description = "The network codec as a shared library: GTFS feeds read into authored network documents and written back, trip for trip. Shared library under the cap-network capability."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
ts-rs = { workspace = true }
chrono = { workspace = true }
transit-network = { path = "../transit-network" }
# The whole-spec feed layer (src/feed.rs): zip members, CSV tables,
# locations.geojson.
zip = { workspace = true }
csv = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = "1"
# The regression fixtures' summaries read the old parser's counts.
transit-core = { path = "../transit-core" }
# The transfer-fixture regression test reads the composed question
# (walking groups, timed connections) through the analysis library.
transit-analysis = { path = "../transit-analysis" }
