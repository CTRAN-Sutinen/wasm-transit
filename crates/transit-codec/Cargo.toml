[package]
name = "transit-codec"
description = "The network codec as a shared library: authored network documents expanded into the derived-feed view (and GTFS feeds inferred into authored documents). Shared library under the cap-network capability."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
ts-rs = { workspace = true }
chrono = { workspace = true }
transit-core = { path = "../transit-core" }
transit-network = { path = "../transit-network" }

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1"
zip = { workspace = true }
# The spec round-trip law reads both feeds as raw CSV tables — an
# oracle independent of the parser under test.
csv = { workspace = true }
# The transfer-fixture regression test reads the composed question
# (walking groups, timed connections) through the analysis library.
transit-analysis = { path = "../transit-analysis" }
