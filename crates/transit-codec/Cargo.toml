[package]
name = "transit-codec"
description = "The network codec as a shared library: GTFS feeds read into authored network documents and written back, trip for trip. Shared library under the cap-network capability."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
# The whole-spec feed layer (src/feed.rs): zip members, CSV tables,
# locations.geojson.
zip = { workspace = true }
csv = { workspace = true }
serde_json = { workspace = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings", "transit-network/bindings", "transit-date/bindings"]

[dev-dependencies]
proptest = "1"
# The transfer-fixture regression test reads the composed question
# (walking groups, timed connections) through the analysis library.
transit-analysis = { path = "../transit-analysis" }
# The stops' history through a GTFS zip and back: the stops
# document a pick reads.
transit-stops = { path = "../transit-stops" }
transit-date = { path = "../transit-date", default-features = false }
