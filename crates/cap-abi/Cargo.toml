[package]
name = "cap-abi"
description = "The capability-module seam: the flat import-free C ABI as a macro, plus the capability-manifest contract every host assembles from."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true }
# gen-manifest computes the network capability's worked examples from
# the REAL fixture (import → document, export → zip): examples that
# cannot drift from the code.
transit-core = { path = "../transit-core" }
transit-network = { path = "../transit-network" }
transit-codec = { path = "../transit-codec" }
# …and the analysis capability's examples compute REAL answers over
# the fixture-derived document through the same library the module
# dispatches through.
transit-analysis = { path = "../transit-analysis" }
chrono = { workspace = true }
# …and the rt capability's example decodes the real e2e payload.
transit-rt = { path = "../transit-rt" }
# …and the dispatch capability's examples compute REAL answers over
# the fixture-derived document (boards, chains, edit reports)
# through the same shared library the module dispatches through.
transit-sync = { path = "../transit-sync" }
transit-dispatch = { path = "../transit-dispatch" }

[dev-dependencies]
proptest = "1"

[[bin]]
name = "gen-manifest"
path = "src/bin/gen_manifest.rs"
