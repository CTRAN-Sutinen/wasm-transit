[package]
name = "cap-abi"
description = "The capability-module seam: the flat import-free C ABI as a macro, plus the capability-manifest contract every host assembles from."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
ts-rs = { workspace = true }
# gen-manifest computes the network capability's worked examples from
# the REAL fixture (import → document, export → zip): examples that
# cannot drift from the code.
transit-network = { path = "../transit-network" }
transit-codec = { path = "../transit-codec" }
# …and the analysis capability's examples compute REAL answers over
# the fixture-derived document through the same library the module
# dispatches through.
transit-analysis = { path = "../transit-analysis" }
chrono = { workspace = true }
# …and the rt capability's example decodes the real e2e payload.
transit-rt = { path = "../transit-rt" }
# …and the live document (the rt → board edge) is computed the same way.
transit-live = { path = "../transit-live" }
# …and the dispatch capability's examples compute REAL answers over
# the fixture-derived document (boards, chains, edit reports)
# through the same shared library the module dispatches through.
transit-sync = { path = "../transit-sync" }
transit-dispatch = { path = "../transit-dispatch" }
# …and the work-rule document kind and the runcut's recovery and
# suggested-blocking examples (the runs layer, beside the network).
transit-runs = { path = "../transit-runs" }
# …and the stops document kind (each stop a list of dated events,
# beside the plans; D-153).
transit-stops = { path = "../transit-stops" }
# …and the stop requests kind (D-159).
transit-requests = { path = "../transit-requests" }
# …and the router's examples compute REAL itineraries over the same
# composition (materialize, patch, build, query) the module runs.
transit-router = { path = "../transit-router", optional = true }
# …and the street capability's examples compute REAL snap/route
# answers over the e2e street fixture through the same library.
transit-streets = { path = "../transit-streets" }
# …and the sync and plan-chain capabilities' examples compute REAL
# answers (merge + submit; resolve/validate/periods) through the
# same libraries the modules dispatch through.
transit-plans = { path = "../transit-plans", optional = true }
# …and the authorization capability's example computes a REAL
# fail-closed decision through the same library the module dispatches
# through.
transit-authz = { path = "../transit-authz", optional = true }
# …and the registry publishes every document kind's JSON Schema,
# generated from those libraries' serde types (never hand-written).
schemars = { workspace = true }

[dev-dependencies]
proptest = "1"
transit-router = { path = "../transit-router" }
transit-plans = { path = "../transit-plans" }
transit-authz = { path = "../transit-authz" }

# The generator's libraries: gen-manifest computes the router's, the
# plan chain's and authorization's worked examples through them, but the
# kernel never names them, and every module links the kernel — so they
# are optional, outside every module's closure (arch-gates, the kernel's
# closure; docs/architecture/release-artifacts.md).
[features]
gen-manifest = ["dep:transit-router", "dep:transit-plans", "dep:transit-authz"]

[[bin]]
name = "gen-manifest"
path = "src/bin/gen_manifest.rs"
required-features = ["gen-manifest"]

[[bin]]
name = "gen-assemblies"
path = "src/bin/gen_assemblies.rs"

[[bin]]
name = "arch-gates"
path = "src/bin/arch_gates.rs"
