[package]
name = "cap-abi"
description = "The capability-module seam: the flat import-free C ABI as a macro, plus the capability-manifest contract every host assembles from."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ryu-js = { workspace = true }
itoa = { workspace = true }
flate2 = { workspace = true }
ts-rs = { workspace = true }
chrono = { workspace = true }
schemars = { workspace = true }
# The kernel's registries name each kind's type (src/kernel.rs, one
# static for each kind), and its derivations name theirs (the day,
# transit-dispatch), so the kernel depends on each one's library.
# Each library is in every module's closure (the arch gates' kernel
# closure). D-239 moves each kind's load into its own library.
transit-network = { path = "../transit-network" }
transit-codec = { path = "../transit-codec" }
transit-analysis = { path = "../transit-analysis" }
transit-rt = { path = "../transit-rt" }
transit-live = { path = "../transit-live" }
transit-sync = { path = "../transit-sync" }
transit-dispatch = { path = "../transit-dispatch" }
transit-rider = { path = "../transit-rider" }
transit-runs = { path = "../transit-runs" }
transit-stops = { path = "../transit-stops" }
transit-requests = { path = "../transit-requests" }
transit-alerts = { path = "../transit-alerts" }
transit-notes = { path = "../transit-notes" }
transit-streets = { path = "../transit-streets" }

[dev-dependencies]
proptest = "1"
transit-router = { path = "../transit-router" }
transit-plans = { path = "../transit-plans" }
transit-authz = { path = "../transit-authz" }
# The real-output gate and the real-data soak (tests/real_output_test.rs,
# tests/real_data_soak.rs): every capability's own dispatch, its answers
# checked against the locked schemas. Tests only: no module links them.
jsonschema = { version = "=0.26.1", default-features = false }
cap-analysis = { path = "../cap-analysis" }
cap-author = { path = "../cap-author" }
cap-authz = { path = "../cap-authz" }
cap-board = { path = "../cap-board" }
cap-calendar = { path = "../cap-calendar" }
cap-directory = { path = "../cap-directory" }
cap-divert = { path = "../cap-divert" }
cap-gtfs = { path = "../cap-gtfs" }
cap-log = { path = "../cap-log" }
cap-migrate = { path = "../cap-migrate" }
cap-network = { path = "../cap-network" }
cap-plans = { path = "../cap-plans" }
cap-requests = { path = "../cap-requests" }
cap-alerts = { path = "../cap-alerts" }
cap-notes = { path = "../cap-notes" }
cap-disruptions = { path = "../cap-disruptions" }
cap-router = { path = "../cap-router" }
cap-rt = { path = "../cap-rt" }
cap-runcut = { path = "../cap-runcut" }
cap-stops = { path = "../cap-stops" }
cap-streets = { path = "../cap-streets" }
cap-sync = { path = "../cap-sync" }

[[bin]]
name = "gen-assemblies"
path = "src/bin/gen_assemblies.rs"

[[bin]]
name = "arch-gates"
path = "src/bin/arch_gates.rs"
