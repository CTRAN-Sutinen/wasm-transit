[package]
name = "cap-abi"
description = "The capability-module seam: the flat import-free C ABI as a macro, plus the capability-manifest contract every host assembles from."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version" }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
schemars = { workspace = true }
# No domain library: each kind's library implements
# `transit_version::Load`, and the kernel keeps one registry for each
# type (D-239). An arch gate holds the kernel to transit-version alone.

[dev-dependencies]
proptest = "1"
# The law tests build gzip streams, digests, and ECMAScript numbers.
sha2 = { workspace = true }
ryu-js = { workspace = true }
flate2 = { workspace = true }
# The law tests read real kinds (canonical JSON, unknown fields, the
# versioned reads). Tests only: no module links them through the kernel.
transit-network = { path = "../transit-network" }
transit-codec = { path = "../transit-codec" }
transit-live = { path = "../transit-live" }
transit-sync = { path = "../transit-sync" }
transit-rider = { path = "../transit-rider" }
transit-runs = { path = "../transit-runs" }
transit-stops = { path = "../transit-stops" }
transit-requests = { path = "../transit-requests" }
transit-streets = { path = "../transit-streets" }
transit-plans = { path = "../transit-plans" }
transit-authz = { path = "../transit-authz" }

[[bin]]
name = "gen-assemblies"
path = "src/bin/gen_assemblies.rs"

[[bin]]
name = "arch-gates"
path = "src/bin/arch_gates.rs"
