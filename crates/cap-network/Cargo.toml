[package]
name = "cap-network"
description = "The network codec capability: infer an authored network document from a GTFS feed (the planner's bootstrap) and export one back to GTFS bytes (the publish path). The second capability extracted from the monolith — transit-codec is shared as a library."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
transit-network = { path = "../transit-network" }
transit-codec = { path = "../transit-codec" }
cap-abi = { path = "../cap-abi" }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true }

[features]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]

[dev-dependencies]
sha2 = { workspace = true }

