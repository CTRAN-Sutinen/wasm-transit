[package]
name = "transit-ops"
description = "Host-agnostic operations layer: the dispatch seam every host (wasm-bindgen, wasmtime, tests) shares"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
ts-rs = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
prost = { workspace = true }
transit-core = { path = "../transit-core" }
transit-sync = { path = "../transit-sync" }
transit-network = { path = "../transit-network" }
transit-analysis = { path = "../transit-analysis" }
transit-codec = { path = "../transit-codec" }

[dev-dependencies]
proptest = "1"
zip = { workspace = true }
# The panic-fuzz layer still decodes raw bytes directly (the decode op
# itself moved to cap-rt with its decoder).
transit-rt = { path = "../transit-rt" }
