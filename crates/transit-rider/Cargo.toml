[package]
name = "transit-rider"
description = "A rider's own documents: the watchlist (saved stops, with its version chain) and the records a device keeps (recent places, live-feed choices). They never describe the agency's service, and no operator document depends on them."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
# The watchlist's migration chain steps over JSON values.
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings"]

[dev-dependencies]
proptest = "1"
