[package]
name = "transit-log"
description = "The append-only log of the agency's record (D-190): entries of changed records, the fold, checkpoints, the revert, and the idempotency keys. Kind-agnostic and pure."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings"]

[dev-dependencies]
proptest = "1"
