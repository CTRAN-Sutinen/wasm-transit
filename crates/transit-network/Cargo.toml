[package]
name = "transit-network"
description = "The authored network model: patterns, service rules, runcut. GTFS is a codec at the boundary, never the shape"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version" }
# The stops document: a pick's stops are refreshed from it (D-156).
transit-stops = { path = "../transit-stops" }
serde = { workspace = true }
ts-rs = { workspace = true }
schemars = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
# read_network: documents written before trips were stored migrate
# as JSON values.
serde_json = { workspace = true }

[dev-dependencies]
proptest = "1"
