[package]
name = "cap-alerts"
description = "The service alerts capability (transit-alerts; D-206, D-207, D-209): what the agency tells riders, in the network's ids. validate answers what a write must pass, each refusal named, or the canonical document and its hash; put and end answer the next document; list answers the agency's list at a moment; flags answers what a person is told about alerts that pass; validate_templates, put_template, templates, and fill are the agency's standard language with blanks (templates answers the menu). The kernel's load_service_alerts and load_alert_templates register documents the host holds. The module writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
transit-log = { path = "../transit-log", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-alerts = { path = "../transit-alerts", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-version/bindings", "transit-log/bindings", "transit-alerts/bindings", "transit-network/bindings", "cap-abi/bindings", "fixtures?/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
