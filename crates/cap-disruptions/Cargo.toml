[package]
name = "cap-disruptions"
description = "The disruptions capability (transit-disruptions; D-213): what is disrupted on a day, and does an alert explain it? today answers the day by route, each disruption with the names a rider uses, the alerts that explain it, and its latest note; gaps answers what no alert explains. It reads the network, the edit document, the live document, the stops, the service alerts, and the notes. The module writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }
transit-disruptions = { path = "../transit-disruptions", default-features = false }
transit-alerts = { path = "../transit-alerts", default-features = false }
transit-live = { path = "../transit-live", default-features = false }
transit-notes = { path = "../transit-notes", default-features = false }
transit-sync = { path = "../transit-sync", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
transit-stops = { path = "../transit-stops", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-disruptions/bindings", "transit-alerts/bindings", "transit-live/bindings", "transit-notes/bindings", "transit-sync/bindings", "transit-network/bindings", "transit-stops/bindings", "cap-abi/bindings", "fixtures?/bindings", "transit-date/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
