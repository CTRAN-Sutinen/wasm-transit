[package]
name = "transit-alerts"
description = "The service alerts document and the alert templates document (D-206, D-207, D-209): the agency's alerts in model ids, what a write must pass, what a person is told about one that passes, ending an alert, the agency's list, and the template fill. Pure and stateless."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings", "transit-network/bindings", "transit-date/bindings"]

[dev-dependencies]
proptest = "1"
transit-codec = { path = "../transit-codec" }
