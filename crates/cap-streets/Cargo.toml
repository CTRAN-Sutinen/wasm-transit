[package]
name = "cap-streets"
description = "The street-graph capability: import a street layer into the canonical streets document (answered to the host with its hash), register a document the host holds, and answer where along the streets — snap a point to the nearest street, route between two positions along the graph. transit-streets is shared as a library; the module writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]  # rlib: integration tests link the crate natively

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
transit-streets = { path = "../transit-streets" }
cap-abi = { path = "../cap-abi" }
