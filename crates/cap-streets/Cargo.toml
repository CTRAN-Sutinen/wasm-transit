[package]
name = "cap-streets"
description = "The street-graph capability: import a street layer into the canonical streets document (answered to the host with its hash), register a document the host holds, and answer where along the streets — snap a point to the nearest street, route between two positions along the graph. transit-streets is shared as a library; the module writes nothing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-streets = { path = "../transit-streets", default-features = false }
transit-network = { path = "../transit-network", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-streets/bindings", "transit-network/bindings", "cap-abi/bindings", "fixtures?/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
