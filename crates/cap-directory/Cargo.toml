[package]
name = "cap-directory"
description = "The directory capability: what exists in the network — the stops (with their walking-group structure; by name, by id, or the places nearest a point), the routes, one route's patterns with their ordered stops (list to detail, the pickers' and the names join's one question). Model-native over the NETWORK document; the pickers are model questions, never feed reads."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true, optional = true }
transit-network = { path = "../transit-network", default-features = false }
cap-abi = { path = "../cap-abi", default-features = false }
# The worked examples' fixtures, for the `examples` feature only.
fixtures = { path = "../fixtures", optional = true, default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "transit-network/bindings", "cap-abi/bindings", "fixtures?/bindings"]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]

[dev-dependencies]
sha2 = { workspace = true }
proptest = "1"
transit-codec = { path = "../transit-codec" }
