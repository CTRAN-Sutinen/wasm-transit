[package]
name = "transit-plans"
description = "The service-plan chain as a shared library: resolution (which pick is in force), governing periods, and chain validity over the plan set's metadata — derived, never stored. The cross-document counterpart of transit-sync's cross-record merge; the cap-plans capability dispatches through it."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
transit-version = { path = "../transit-version", default-features = false }
serde = { workspace = true }
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
transit-date = { path = "../transit-date", default-features = false }

[features]
# The TS bindings and the JSON Schemas (`just types`, gen-manifest). A
# module build turns it off: its crates name every workspace crate
# with default-features = false.
default = ["bindings"]
bindings = ["dep:ts-rs", "dep:schemars", "transit-version/bindings", "transit-date/bindings"]

[dev-dependencies]
serde_json = { workspace = true }
proptest = "1"
