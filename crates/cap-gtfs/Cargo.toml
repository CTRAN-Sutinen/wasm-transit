[package]
name = "cap-gtfs"
description = "The gtfs capability: the FEED document — parse a GTFS zip into a content-hash-keyed feed registry and answer the reads only the feed itself carries (identity, stop names, the stop list for pickers). A horizontal capability module — assembled per user, never one-size-fits-all."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]  # rlib: integration tests link the crate natively

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true }
transit-codec = { path = "../transit-codec" }
cap-abi = { path = "../cap-abi" }
