[package]
name = "cap-gtfs"
description = "The gtfs capability: the FEED document — parse a GTFS zip into a content-hash-keyed feed registry and answer the reads only the feed itself carries (identity, stop names, the stop list for pickers). A horizontal capability module — assembled per user, never one-size-fits-all."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ts-rs = { workspace = true }
transit-codec = { path = "../transit-codec" }
cap-abi = { path = "../cap-abi" }
# The worked examples' fixtures, for the `examples` feature only (D-235).
fixtures = { path = "../fixtures", optional = true }

[features]
# The worked examples (`examples::examples`), which the generator runs.
# No module build turns it on.
examples = ["dep:fixtures"]
