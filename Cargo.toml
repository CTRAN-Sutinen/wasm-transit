[workspace]
resolver = "2"
members = [
    "crates/transit-network",
    "crates/transit-codec",
    "crates/transit-router",
    "crates/transit-rt",
    "crates/transit-streets",
    "crates/transit-stops",
    "crates/transit-sync",
    "crates/transit-authz",
    "crates/transit-plans",
    "crates/transit-live",
    "crates/cap-abi",
    "crates/cap-gtfs",
    "crates/cap-router",
    "crates/cap-analysis",
    "crates/cap-network",
    "crates/cap-board",
    "crates/cap-runcut",
    "crates/cap-calendar",
    "crates/cap-directory",
    "crates/cap-rt",
    "crates/cap-streets",
    "crates/cap-sync",
    "crates/cap-authz",
    "crates/cap-plans",
    "crates/cap-author",
    "crates/cap-divert",
    "crates/cap-migrate",
    "crates/cap-stops",
    "crates/transit-analysis",
    "crates/transit-dispatch",
    "crates/transit-runs",
    "crates/transit-version",
    # The assembly crates (gen-assemblies, `just caps` — generated and
    # gitignored, assemblies/.gitkeep keeps the directory): the modules —
    # each capability alone, and each generated UI's capabilities linked.
    "assemblies/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly-rounded float parsing, so any f64 in a
# document survives serialize -> parse bit-exactly (the default
# parser is 1 ULP off on some values — this bit real coordinates).
# Every JSON boundary (dispatch ABI, sync documents, manifests)
# relies on it.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Gzip streams: a published document crosses into a module compressed
# and is decoded as it parses (cap_abi::parse_document).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "1"
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
# TypeScript bindings for every type that crosses the wasm boundary:
# the TS contract is generated from the Rust model (single source of
# truth — hand-written .d.ts drifts). serde-compat makes the derives
# mirror the serde attributes (tags, renames).
ts-rs = { version = "12", features = ["serde-compat"] }
# JSON Schema for every document kind, generated from the same serde
# types (never hand-written) and published with the registry's
# evidence (gen-manifest): a reader outside the wasm validates a
# stored blob with no Rust (docs/FORMATS.md). chrono04: dates are
# "YYYY-MM-DD" strings (format: date).
schemars = { version = "1", features = ["chrono04"] }
# Capability modules address documents by content hash (the manifest
# format) — sha256 is the hash everywhere (Rust, JS crypto.subtle,
# Go crypto).
sha2 = "0.10"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# The wasm artifact: opt-level 3, LTO, one codegen unit, abort-on-panic
# (traps are host errors, never caught). 3 over "s" is measured on the
# C-TRAN network (docs/units/runtime-cost-gate.md): registration is
# the hot path every module runs on every page, and its streamed
# decode (cap_abi::parse_document) is per-byte code that "s" leaves
# un-inlined — 3 registers in ~60% of the time for modules ~25% larger.
# Per-crate opt levels measured worse on both (they fight LTO).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The iteration loop's modules (`just caps-fast`): release semantics
# (panic abort, stripped) without whole-program LTO or one codegen unit,
# and incremental — a change to one library re-links in seconds, not
# minutes. Never published: the registry, the reproducible gate, and
# `just test` build `release`.
[profile.wasm-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# Dev and test builds (the test profile inherits dev) keep line tables
# only: backtraces still name file and line, and the full DWARF, the bulk
# of target/, is dropped. The release wasm above
# is unaffected.
[profile.dev]
debug = "line-tables-only"
